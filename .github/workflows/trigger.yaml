name: Terraform Plan

on:
  pull_request:
    branches:
      - prod
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  pull-requests: write
  contents: read

env:
  tf_state_bucket: "asgbucket121"  
  tf_state_key: "asg/prod/terraform.tfstate"  
  tf_region: "ap-south-1"  

jobs:
  terraform-plan-output:
    if: github.event_name == 'pull_request'
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=$tf_state_bucket" -backend-config="key=$tf_state_key" -backend-config="region=$tf_region" -backend-config="encrypt=true"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
        working-directory: enviroments/prod

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: enviroments/prod

      - name: Terraform Plan  
        id: plan
        run: terraform plan -no-color -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        working-directory: enviroments/prod
        continue-on-error: false

      - name: Update Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOKEN }}
          script: |
            const output = `#### Terraform Format and Style: \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization: \`${{ steps.init.outcome }}\`
            #### Terraform Validation: \`${{ steps.validate.outcome }}\`
            #### Terraform Plan: \`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  trigger-dope-workflow:
    if: github.event.pull_request.merged == true
    name: Trigger Dope Workflow
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Dope Workflow
        run: |
          response=$(curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -w "\nHTTP_STATUS:%{http_code}" \
            https://api.github.com/repos/${{ github.repository_owner }}/Dope/dispatches \
            -d '{
              "event_type": "terraform-trigger",
              "client_payload": {
                "repository": "${{ github.event.repository.name }}",
                "branch": "prod",
                "action": "plan"
              }
            }')
          
          echo "Response: $response"
          
          # Extract the HTTP status code from the response
          response_code=$(echo $response | grep -o 'HTTP_STATUS:[^ ]*' | cut -d':' -f2)

          # Check for failure status codes
          if [[ $response_code == 4* ]] || [[ $response_code == 5* ]]; then
            echo "Error triggering workflow: HTTP Status $response_code"
            exit 1
          fi

      - name: Debug Info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
